<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja Saga Captcha Offline Review & Gallery</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --surface-border: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            padding: 24px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--surface-border);
        }
        h1 { font-size: 1.5rem; font-weight: 700; color: #60a5fa; }
        .stats-bar {
            display: flex;
            gap: 16px;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        .stats-bar strong { color: var(--text-primary); }
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }
        .filter-group {
            display: flex;
            gap: 8px;
        }
        .filter-btn {
            background: var(--surface-color);
            color: var(--text-secondary);
            border: 1px solid var(--surface-border);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }
        .action-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            background: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid var(--surface-border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn:hover { background: #2d3748; }
        .btn-primary { background: var(--accent-color); border-color: var(--accent-color); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-success { background: var(--success-color); border-color: var(--success-color); color: white; }
        .btn-success:hover { background: #059669; }
        .btn-warning { background: var(--warning-color); border-color: var(--warning-color); color: black; }
        .cards-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .card {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 12px;
        }
        .card-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .badge-slider { background: #0284c7; color: white; }
        .badge-drag { background: #7c3aed; color: white; }
        .badge-rotate { background: #d97706; color: white; }
        .badge-labeled { background: #059669; color: white; }
        .badge-unlabeled { background: #475569; color: white; }
        .rejected-pill {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 4px;
        }
        .card-body {
            display: grid;
            grid-template-columns: minmax(400px, 1fr) 340px;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .card-body { grid-template-columns: 1fr; }
        }
        .viewer-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #111827;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--surface-border);
        }
        .canvas-wrapper {
            position: relative;
            display: inline-block;
            margin: 0 auto;
            border: 1px solid #374151;
            border-radius: 4px;
            overflow: hidden;
            background: #000;
        }
        .viewer-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        .viewer-controls input[type="range"] {
            flex: 1;
        }
        .side-images {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
        }
        .side-images img {
            border: 1px solid #374151;
            border-radius: 4px;
            background: #000;
        }
        .side-images .img-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 4px;
        }
        .panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #182234;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--surface-border);
        }
        .candidates-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .cand-btn {
            background: #1e293b;
            color: var(--text-primary);
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .cand-btn:hover {
            border-color: #60a5fa;
            background: #253347;
        }
        .cand-btn.selected {
            background: #1e3a8a;
            border-color: #3b82f6;
            color: #93c5fd;
            font-weight: 600;
        }
        .cand-metrics {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-row label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .form-row input, .form-row select, .form-row textarea {
            background: #0f172a;
            color: var(--text-primary);
            border: 1px solid #334155;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 0.875rem;
        }
        .form-row textarea {
            resize: vertical;
            min-height: 60px;
        }
        .notification {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #10b981;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            font-weight: 600;
            display: none;
            z-index: 1000;
        }
        .test-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 800px;
            max-height: 85vh;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            font-size: 0.875rem;
        }
        th, td {
            padding: 8px 12px;
            border: 1px solid var(--surface-border);
            text-align: left;
        }
        th { background: #0f172a; }
        .text-success { color: #34d399; font-weight: bold; }
        .text-danger { color: #f87171; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Ninja Saga Captcha Offline Review & Tool</h1>
            <p style="color: var(--text-secondary); font-size: 0.875rem; margin-top: 4px;">
                Visual Candidate Selector & Ground Truth Labeler for Slider, Drag, and Rotate Captchas
            </p>
        </div>
        <div class="stats-bar">
            <div>Total: <strong id="stat-total">0</strong></div>
            <div>Slider: <strong id="stat-slider">0</strong></div>
            <div>Drag: <strong id="stat-drag">0</strong></div>
            <div>Rotate: <strong id="stat-rotate">0</strong></div>
            <div>Labeled: <strong id="stat-labeled" style="color: #34d399;">0</strong></div>
        </div>
    </header>

    <div class="controls-bar">
        <div class="filter-group">
            <button class="filter-btn active" onclick="setFilter('all')">All</button>
            <button class="filter-btn" onclick="setFilter('slider')">Slider</button>
            <button class="filter-btn" onclick="setFilter('drag_shape')">Drag Shape</button>
            <button class="filter-btn" onclick="setFilter('rotate')">Rotate</button>
        </div>
        <div class="action-group">
            <button class="btn btn-warning" onclick="runRegressionTest()">⚡ Run Regression Test</button>
            <button class="btn" onclick="copyLabelsJSON()">📋 Copy JSON</button>
            <button class="btn" onclick="downloadLabelsJSON()">💾 Download JSON</button>
            <button class="btn btn-success" onclick="saveLabelsToServer()">💾 Save to captcha_labels.json</button>
        </div>
    </div>

    <div class="cards-grid" id="cards-container">
        <!-- Rendered dynamically -->
    </div>

    <div class="notification" id="notif"></div>

    <div class="test-modal" id="test-modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 style="font-size: 1.25rem;">Regression Test Results</h2>
                <button class="btn" onclick="closeTestModal()">✕ Close</button>
            </div>
            <div id="test-results-body">Testing...</div>
        </div>
    </div>

    <script>
        let inventory = [];
        let labels = {};
        let currentFilter = 'all';

        async function loadData() {
            try {
                const res = await fetch('/api/inventory');
                if (res.ok) {
                    const data = await res.json();
                    inventory = data.inventory;
                    labels = data.labels || {};
                }
            } catch (e) {
                console.warn('API /api/inventory not reachable. Running in standalone static mode.', e);
            }
            updateStats();
            renderCards();
        }

        function updateStats() {
            document.getElementById('stat-total').innerText = inventory.length;
            document.getElementById('stat-slider').innerText = inventory.filter(i => i.type === 'slider').length;
            document.getElementById('stat-drag').innerText = inventory.filter(i => i.type === 'drag_shape').length;
            document.getElementById('stat-rotate').innerText = inventory.filter(i => i.type === 'rotate').length;
            
            const labeledCount = Object.keys(labels).length;
            document.getElementById('stat-labeled').innerText = labeledCount;
        }

        function setFilter(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase().includes(type) || (type === 'all' && btn.innerText === 'All'));
            });
            renderCards();
        }

        function showNotification(msg) {
            const notif = document.getElementById('notif');
            notif.innerText = msg;
            notif.style.display = 'block';
            setTimeout(() => { notif.style.display = 'none'; }, 3000);
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            const filtered = inventory.filter(item => {
                if (currentFilter === 'all') return true;
                return item.type === currentFilter;
            });

            for (const item of filtered) {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = 'card-' + item.id;

                const isLabeled = !!labels[item.id];
                const currentLabel = labels[item.id] || {};

                let badgeClass = 'badge-slider';
                if (item.type === 'drag_shape') badgeClass = 'badge-drag';
                if (item.type === 'rotate') badgeClass = 'badge-rotate';

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title">
                            <span class="badge ${badgeClass}">${item.type}</span>
                            <span>ID: ${item.id}</span>
                            ${item.rejectedX != null ? `<span class="rejected-pill">Server Rejected X: ${item.rejectedX}</span>` : ''}
                            ${item.rejectedAngle != null ? `<span class="rejected-pill">Server Rejected Angle: ${item.rejectedAngle}°</span>` : ''}
                        </div>
                        <div>
                            <span class="badge ${isLabeled ? 'badge-labeled' : 'badge-unlabeled'}">
                                ${isLabeled ? '✓ Labeled' : 'Pending'}
                            </span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="viewer-container" id="viewer-${item.id}">
                            ${renderViewerContent(item)}
                        </div>
                        <div class="panel" id="panel-${item.id}">
                            ${renderPanelContent(item, currentLabel)}
                        </div>
                    </div>
                `;
                container.appendChild(card);

                if (item.type === 'slider' && item.bg && item.pc) {
                    initSliderCanvas(item);
                }
            }
        }

        function renderViewerContent(item) {
            if (item.type === 'slider') {
                return `
                    <div class="canvas-wrapper">
                        <canvas id="canvas-${item.id}" width="380" height="140"></canvas>
                    </div>
                    <div class="viewer-controls">
                        <label>Overlay X: <strong id="lbl-x-${item.id}">0</strong></label>
                        <input type="range" id="scrubber-${item.id}" min="0" max="330" value="0" oninput="onScrub('${item.id}', this.value)">
                        <label>Opacity:</label>
                        <input type="range" id="opacity-${item.id}" min="0" max="100" value="90" style="max-width: 80px;" oninput="onOpacity('${item.id}', this.value)">
                    </div>
                    <div class="side-images">
                        <div>
                            <img src="/images/${item.bg}" width="190" height="70" alt="Background">
                            <div class="img-label">Background</div>
                        </div>
                        <div>
                            <img src="/images/${item.pc}" width="25" height="70" alt="Piece">
                            <div class="img-label">Piece</div>
                        </div>
                        ${item.screenshot ? `
                        <div>
                            <img src="/images/${item.screenshot}" width="140" height="70" style="object-fit: cover;" alt="Live Result">
                            <div class="img-label">Live Screenshot</div>
                        </div>` : ''}
                    </div>
                `;
            } else {
                return `
                    <div class="side-images" style="padding: 20px 0;">
                        <div>
                            <img src="/images/${item.bg}" style="max-width: 240px; max-height: 140px;" alt="Background">
                            <div class="img-label">Background</div>
                        </div>
                        <div>
                            <img src="/images/${item.pc}" style="max-width: 80px; max-height: 140px;" alt="Piece">
                            <div class="img-label">Piece</div>
                        </div>
                        ${item.screenshot ? `
                        <div>
                            <img src="/images/${item.screenshot}" style="max-width: 240px; max-height: 140px; object-fit: cover;" alt="Live Result">
                            <div class="img-label">Result Screenshot</div>
                        </div>` : ''}
                    </div>
                `;
            }
        }

        function renderPanelContent(item, currentLabel) {
            if (item.type === 'slider') {
                const candidates = item.candidates || [];
                return `
                    <div>
                        <label style="font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; display: block;">
                            Detected Checker Candidates (Click to select):
                        </label>
                        <div class="candidates-list">
                            ${candidates.map(cand => {
                                const isSel = currentLabel.targetIndex === cand.index;
                                return `
                                    <button class="cand-btn ${isSel ? 'selected' : ''}" 
                                            onclick="selectCandidate('${item.id}', ${cand.index}, ${cand.x})">
                                        <span>Candidate #${cand.index} (x: ${cand.x})</span>
                                        <span class="cand-metrics">Mismatch: ${cand.borderMismatch} | B: ${cand.boundary}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                    <div class="form-row">
                        <label>Expected Target X</label>
                        <input type="number" id="inp-x-${item.id}" value="${currentLabel.expectedX != null ? currentLabel.expectedX : ''}" 
                               placeholder="e.g. 193" onchange="updateLabel('${item.id}')">
                    </div>
                    <div class="form-row">
                        <label>Confidence</label>
                        <select id="sel-conf-${item.id}" onchange="updateLabel('${item.id}')">
                            <option value="high" ${currentLabel.confidence === 'high' ? 'selected' : ''}>High</option>
                            <option value="medium" ${currentLabel.confidence === 'medium' ? 'selected' : ''}>Medium</option>
                            <option value="low" ${currentLabel.confidence === 'low' ? 'selected' : ''}>Low</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>Notes / Visual Clues</label>
                        <textarea id="txt-notes-${item.id}" placeholder="e.g. Garis lantai dan rak menyambung di checker tengah" onchange="updateLabel('${item.id}')">${currentLabel.notes || ''}</textarea>
                    </div>
                `;
            } else {
                return `
                    <div class="form-row">
                        <label>Expected Answer (Angle / X,Y)</label>
                        <input type="text" id="inp-x-${item.id}" value="${currentLabel.expectedAnswer || ''}" placeholder="Ground truth answer" onchange="updateLabel('${item.id}')">
                    </div>
                    <div class="form-row">
                        <label>Notes</label>
                        <textarea id="txt-notes-${item.id}" onchange="updateLabel('${item.id}')">${currentLabel.notes || ''}</textarea>
                    </div>
                `;
            }
        }

        const canvasImages = {};

        function initSliderCanvas(item) {
            const canvas = document.getElementById('canvas-' + item.id);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            const bgImg = new Image();
            const pcImg = new Image();
            bgImg.src = '/images/' + item.bg;
            pcImg.src = '/images/' + item.pc;

            canvasImages[item.id] = { bg: bgImg, pc: pcImg, x: labels[item.id]?.expectedX || 0, opacity: 0.9 };

            let loaded = 0;
            const onload = () => {
                loaded++;
                if (loaded === 2) {
                    drawSliderCanvas(item.id);
                }
            };
            bgImg.onload = onload;
            pcImg.onload = onload;
        }

        function drawSliderCanvas(id) {
            const canvas = document.getElementById('canvas-' + id);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const data = canvasImages[id];
            if (!data || !data.bg.complete || !data.pc.complete) return;

            const item = inventory.find(i => i.id === id);

            // 1. Draw Background
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(data.bg, 0, 0, canvas.width, canvas.height);

            // 2. Draw candidate boxes on background
            if (item && item.candidates) {
                item.candidates.forEach(cand => {
                    ctx.strokeStyle = '#3b82f6';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 2]);
                    ctx.strokeRect(cand.x, cand.y, cand.width, cand.height);
                    ctx.setLineDash([]);

                    ctx.fillStyle = 'rgba(59, 130, 246, 0.85)';
                    ctx.fillRect(cand.x, cand.y - 18, 48, 16);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.fillText('#' + cand.index + ' (' + cand.x + ')', cand.x + 3, cand.y - 6);
                });
            }

            // 3. Draw Rejected attempt marker if any
            if (item && item.rejectedX != null) {
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 2;
                ctx.setLineDash([2, 2]);
                const top = item.candidates?.[0]?.y || 45;
                ctx.strokeRect(item.rejectedX, top, 50, 50);
                ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(239, 68, 68, 0.9)';
                ctx.fillRect(item.rejectedX, top + 52, 68, 14);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px sans-serif';
                ctx.fillText('REJECT: ' + item.rejectedX, item.rejectedX + 2, top + 63);
            }

            // 4. Draw Piece Overlay at current X
            ctx.save();
            ctx.globalAlpha = data.opacity;
            ctx.drawImage(data.pc, data.x, 0, data.pc.width, data.pc.height);
            // Highlight current overlay border
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 2;
            const pieceTop = item.candidates?.[0]?.y || 45;
            ctx.strokeRect(data.x, pieceTop, 50, 50);
            ctx.restore();
        }

        function onScrub(id, val) {
            const num = Number(val);
            document.getElementById('lbl-x-' + id).innerText = num;
            document.getElementById('inp-x-' + id).value = num;
            if (canvasImages[id]) {
                canvasImages[id].x = num;
                drawSliderCanvas(id);
            }
            updateLabel(id);
        }

        function onOpacity(id, val) {
            if (canvasImages[id]) {
                canvasImages[id].opacity = Number(val) / 100;
                drawSliderCanvas(id);
            }
        }

        function selectCandidate(id, index, x) {
            document.getElementById('scrubber-' + id).value = x;
            document.getElementById('lbl-x-' + id).innerText = x;
            document.getElementById('inp-x-' + id).value = x;

            if (canvasImages[id]) {
                canvasImages[id].x = x;
                drawSliderCanvas(id);
            }

            const item = inventory.find(i => i.id === id);
            const panel = document.getElementById('panel-' + id);
            if (panel) {
                panel.querySelectorAll('.cand-btn').forEach(b => b.classList.remove('selected'));
                panel.querySelectorAll('.cand-btn')[index - 1]?.classList.add('selected');
            }

            labels[id] = {
                type: item.type,
                targetIndex: index,
                expectedX: x,
                confidence: document.getElementById('sel-conf-' + id)?.value || 'high',
                notes: document.getElementById('txt-notes-' + id)?.value || ''
            };

            updateStats();
            showNotification('Candidate #' + index + ' (x: ' + x + ') selected for ID: ' + id);
        }

        function updateLabel(id) {
            const item = inventory.find(i => i.id === id);
            if (!item) return;

            const expX = Number(document.getElementById('inp-x-' + id)?.value);
            const conf = document.getElementById('sel-conf-' + id)?.value || 'high';
            const notes = document.getElementById('txt-notes-' + id)?.value || '';

            let targetIndex = null;
            if (item.candidates) {
                const match = item.candidates.find(c => c.x === expX);
                if (match) targetIndex = match.index;
            }

            labels[id] = {
                type: item.type,
                targetIndex,
                expectedX: expX,
                confidence: conf,
                notes
            };

            updateStats();
        }

        async function saveLabelsToServer() {
            try {
                const res = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(labels)
                });
                if (res.ok) {
                    showNotification('✓ Successfully saved labels to captcha_labels.json!');
                } else {
                    alert('Error saving labels: ' + res.statusText);
                }
            } catch (e) {
                alert('Could not save to server: ' + e.message + '. Use Download JSON instead.');
            }
        }

        function copyLabelsJSON() {
            navigator.clipboard.writeText(JSON.stringify(labels, null, 2));
            showNotification('✓ Copied JSON to clipboard!');
        }

        function downloadLabelsJSON() {
            const blob = new Blob([JSON.stringify(labels, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'captcha_labels.json';
            a.click();
            URL.revokeObjectURL(url);
            showNotification('✓ Downloaded captcha_labels.json');
        }

        async function runRegressionTest() {
            const modal = document.getElementById('test-modal');
            const body = document.getElementById('test-results-body');
            modal.style.display = 'flex';
            body.innerHTML = '<p>Running regression tests across labeled artifacts...</p>';

            try {
                const res = await fetch('/api/test');
                if (res.ok) {
                    const result = await res.json();
                    let html = `
                        <div style="margin-bottom: 16px; font-size: 1.1rem;">
                            Accuracy: <strong>${result.passed}/${result.total} (${result.accuracy}%)</strong>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Type</th>
                                    <th>Expected X</th>
                                    <th>Detected X</th>
                                    <th>Diff (px)</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    result.results.forEach(r => {
                        html += `
                            <tr>
                                <td>${r.id}</td>
                                <td>${r.type}</td>
                                <td>${r.expectedX}</td>
                                <td>${r.detectedX}</td>
                                <td>${r.diff}px</td>
                                <td class="${r.pass ? 'text-success' : 'text-danger'}">${r.pass ? 'PASS' : 'FAIL'}</td>
                            </tr>
                        `;
                    });
                    html += '</tbody></table>';
                    body.innerHTML = html;
                } else {
                    body.innerHTML = '<p class="text-danger">Failed to run tests: ' + res.statusText + '</p>';
                }
            } catch (e) {
                body.innerHTML = '<p class="text-danger">Error: ' + e.message + '</p>';
            }
        }

        function closeTestModal() {
            document.getElementById('test-modal').style.display = 'none';
        }

        window.onload = loadData;
    </script>
</body>
</html>
